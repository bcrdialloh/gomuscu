name: Build GoMuscu iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Récupérer GoMuscu
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Installer Flet 0.86.4
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.4

      - name: Vérifier environnement
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== FLET ====="
          flet --version

          echo "===== FLUTTER ====="
          flutter --version

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== MACOS ====="
          sw_vers

      - name: Préparer Flutter iOS
        run: |
          flutter precache --ios

      - name: Construire GoMuscu
        run: |
          flet build ipa \
            --no-rich-output \
            --yes \
            --swift-package-manager \
            --build-version 1.0.0 \
            --build-number ${{ github.run_number }}

      - name: Vérifier le résultat
        if: always()
        run: |
          echo "===== IPA ====="
          find . -type f -name "*.ipa" -print

          echo "===== XCARCHIVE ====="
          find . -type d -name "*.xcarchive" -print

          echo "===== APP ====="
          find . -type d -name "*.app" -print

      - name: Télécharger le build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoMuscu-iOS
          path: |
            **/*.ipa
            **/*.xcarchive
          if-no-files-found: error
