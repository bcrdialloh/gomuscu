name: Build GoMuscu iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Vérifier l'environnement
        run: |
          python --version
          flutter --version
          xcodebuild -version

      - name: Installer Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.4

      - name: Nettoyer les anciens builds
        run: |
          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -f ios/Podfile.lock

      - name: Construire GoMuscu
        run: |
          flet build ipa --no-rich-output

      - name: Rechercher les fichiers générés
        if: always()
        run: |
          echo "=== IPA ==="
          find . -name "*.ipa" -print
          echo "=== XCARCHIVE ==="
          find . -name "*.xcarchive" -print

      - name: Récupérer l'IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoMuscu-iOS
          path: "**/*.ipa"
          if-no-files-found: error