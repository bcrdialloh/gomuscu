name: Build GoMuscu iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Vérifier Flutter et Xcode
        run: |
          flutter --version
          flutter doctor -v
          xcodebuild -version
          xcode-select -p

      - name: Installer Flet 0.86.4
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.4
          flet --version

      - name: Préparer le projet iOS
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Construire GoMuscu
        run: |
          flet build ipa --no-rich-output

      - name: Chercher les fichiers générés
        if: always()
        run: |
          echo "=== FICHIERS IPA ==="
          find . -name "*.ipa" -print
          echo "=== FICHIERS XCARCHIVE ==="
          find . -name "*.xcarchive" -print

      - name: Récupérer l'IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoMuscu-iOS
          path: |
            **/*.ipa
            **/*.xcarchive
          if-no-files-found: error
